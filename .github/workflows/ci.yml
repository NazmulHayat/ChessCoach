name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stockfish && echo "/usr/games" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test (85 tests, including 58 full reviews checked against the Python reference)
        run: npm test
      - name: Build
        run: npm run build
