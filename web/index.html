    <script>
      // Match the saved appearance before first paint; unavailable storage uses System.
      let appearance = 'system'
      try { appearance = JSON.parse(localStorage.getItem('cc.settings') || '{}').appearance || 'system' } catch { /* Use System. */ }
      document.documentElement.dataset.theme = appearance === 'dark' || appearance === 'light'
        ? appearance : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    </script>
